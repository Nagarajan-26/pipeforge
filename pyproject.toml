[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeforge"
version = "0.1.0"
description = "Visual benchmark factory for enterprise data-pipeline incident reasoning."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "networkx>=3.7",
    "matplotlib>=3.10",
    "pandas>=2.3",
    "pydantic>=2.10",
    "Pillow>=11.0",
    "streamlit>=1.50",
    "python-dotenv>=1.0",
    "jsonschema>=4.23"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"

]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
